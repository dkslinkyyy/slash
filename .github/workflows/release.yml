name: Build and Deploy Electron App

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18 # Ensure this matches your local Node.js version

      - name: Install Wine (for Windows builds)
        run: |
          sudo dpkg --add-architecture i386
          sudo apt update
          sudo apt install wine64 wine32 -y
          winecfg # This sets up Wine

      - name: Install dependencies
        run: |
          npm install

      - name: Build React app
        run: |
          npm run build

      - name: Package Electron app
        run: |
          export GH_TOKEN=${{ secrets.GITHUB_TOKEN }}
          npm run electron:build
      - name: Upload release folder
        uses: actions/upload-artifact@v4
        with:
          name: electron-build
          path: release/ # Point to the entire release folder

  release:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: electron-build
          path: release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.6
          files: release/ # Use the entire folder instead of just the .zip file
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
