name: Build and Release Electron App

on:
  push:
    tags:
      - "v*" # Triggers when a new version tag is pushed (e.g., v1.0.0)

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3 # Use latest version

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18" # Use your preferred Node.js version

      - name: Install dependencies
        run: npm install

      - name: Build React app
        run: npm run build # Ensure React app is built

      - name: Build Electron app
        run: npm run electron:build # Builds the Electron application

      - name: Upload built installers as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-app-artifacts
          path: release/ # Adjust path if necessary (this is where electron-builder saves output)

      - name: Create GitHub Release & Upload Installers
        uses: softprops/action-gh-release@v1
        with:
          files: release/*.{exe,dmg,AppImage} # Uploads all generated installers
